{{define "head"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{.Title}} · Slot</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon{{if .Admin}}-admin{{end}}.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{if .Admin}}{{admin "/"}}{{else}}/{{end}}" aria-label="Slot home"><span class="brand-icon">s.</span>slot</a>
  </header>
{{end}}

{{define "foot"}}
  <footer>
    <span>Calendar Bookings Should be Free</span>
  </footer>
</body>
</html>
{{end}}

{{define "timezones"}}<datalist id="timezones">{{range .Timezones}}<option value="{{.}}">{{end}}</datalist>{{end}}

{{define "messages"}}
  {{if .Error}}<div class="alert error" role="alert">{{.Error}}</div>{{end}}
  {{if .Notice}}<div class="alert" role="status">{{.Notice}}</div>{{end}}
{{end}}
